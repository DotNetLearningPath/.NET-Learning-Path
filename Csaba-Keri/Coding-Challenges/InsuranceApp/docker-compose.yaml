name: insurance-app

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - insurance_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_app}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance_local_demo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  insurance_postgres_data:
