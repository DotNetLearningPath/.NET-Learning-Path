info:
  name: Deactivate broker
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/admin/brokers/{{brokerId}}/deactivate"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });\r

        test('Broker is inactive', function () { expect(res.getBody().status).to.eql(0); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
