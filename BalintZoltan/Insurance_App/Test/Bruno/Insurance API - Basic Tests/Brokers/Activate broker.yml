info:
  name: Activate broker
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/admin/brokers/{{brokerId}}/activate"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });\r

        test('Broker is active', function () { expect(res.getBody().status).to.eql(1); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
