info:
  name: Update client
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/brokers/clients/{{clientId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "clientType": 0,
        "name": "Postman Client Updated",
        "identificationNumber": "{{identificationNumber}}",
        "email": "updated@example.com",
        "phone": "+40712345679",
        "address": "Updated Street 2"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });\r

        test('Name was updated', function () { expect(res.getBody().name).to.eql('Postman Client Updated'); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
