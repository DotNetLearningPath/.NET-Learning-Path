info:
  name: Update fee configuration
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/fees/{{feeId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "{{feeName}} Updated",
        "type": 2,
        "percentage": 6.5,
        "effectiveFrom": "2026-01-01T00:00:00Z",
        "effectiveTo": null,
        "isActive": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });\r

        test('Fee percentage was updated', function () { expect(res.getBody().percentage).to.eql(6.5); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
