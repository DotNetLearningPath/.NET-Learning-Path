info:
  name: Get fee configuration by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/admin/fees/{{feeId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test('Status is 200 OK', function () {
          expect(res.getStatus()).to.equal(200);
        });

        test('Response contains the created fee id', function () {
          expect(res.getBody().id).to.eql(bru.getCollectionVar('feeId'));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
