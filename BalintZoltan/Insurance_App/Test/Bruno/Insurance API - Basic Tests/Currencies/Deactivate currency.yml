info:
  name: Deactivate currency
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/admin/currencies/{{currencyId}}/deactivate"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });
        const body = res.getBody();
        test('Currency is inactive', function () { expect(body.isActive).to.eql(false); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
