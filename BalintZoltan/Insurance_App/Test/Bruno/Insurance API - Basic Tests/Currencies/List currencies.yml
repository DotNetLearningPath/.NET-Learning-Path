info:
  name: List currencies
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/admin/currencies?pageNumber=1&pageSize=10"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });
        const body = res.getBody();
        test('Response contains paged items', function () { expect(body.items).to.be.an('array'); });
        test('Page number is 1', function () { expect(body.pageNumber).to.eql(1); });
        test('Page size is 10', function () { expect(body.pageSize).to.eql(10); });
        test('Total count is numeric', function () { expect(body.totalCount).to.be.a('number'); });
        test('Total pages is numeric', function () { expect(body.totalPages).to.be.a('number'); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
