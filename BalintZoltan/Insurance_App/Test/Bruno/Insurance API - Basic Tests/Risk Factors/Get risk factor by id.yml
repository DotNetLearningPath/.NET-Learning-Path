info:
  name: Get risk factor by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/admin/risk-factors/{{riskFactorId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |
        test('Status is 200 OK', function () {
          expect(res.getStatus()).to.equal(200);
        });

        const body = res.getBody();
        test('Response id matches requested id', function () {
          expect(body.id).to.eql(bru.getCollectionVar('riskFactorId'));
        });
        test('Response contains risk factor fields', function () {
          expect(body).to.have.all.keys('id', 'level', 'reference', 'adjustmentPercentage', 'isActive');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
