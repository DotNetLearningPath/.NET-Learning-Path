info:
  name: Deactivate risk factor
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/admin/risk-factors/{{riskFactorId}}/deactivate"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });\r

        const body = res.getBody();\r

        test('Risk factor is inactive', function () { expect(body.isActive).to.eql(false); });\r

        test('Response contains risk factor id', function () { expect(body.id).to.eql(bru.getCollectionVar('riskFactorId')); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
