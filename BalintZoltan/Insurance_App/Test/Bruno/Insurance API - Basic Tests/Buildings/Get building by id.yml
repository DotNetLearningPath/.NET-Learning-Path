info:
  name: Get building by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/brokers/buildings/{{buildingId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });\r

        test('Returned id matches requested id', function () { expect(res.getBody().id).to.eql(bru.getCollectionVar('buildingId')); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
