info:
  name: Create building - client not found
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/brokers/clients/{{missingId}}/buildings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "cityId": "{{$guid}}",
        "street": "Invalid Street",
        "number": "1",
        "constructionYear": 2000,
        "type": 5,
        "numberOfFloors": 1,
        "surfaceArea": 50,
        "insuredValue": 100000,
        "isFloodRiskZone": false,
        "isEarthquakeRiskZone": false
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('missingId', bru.interpolate('{{$guid}}'));
    - type: after-response
      code: test('Status is 404 Not Found', function () { expect(res.getStatus()).to.equal(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
