info:
  name: Create client - invalid CNP
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/brokers/clients"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "clientType": 0,
        "name": "Invalid Client",
        "identificationNumber": "123",
        "email": "invalid@example.com",
        "phone": "+40712345678"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('Status is 400 Bad Request', function () { expect(res.getStatus()).to.equal(400); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
