info:
  name: Get broker - not found
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/api/admin/brokers/{{missingBrokerId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('missingBrokerId', bru.interpolate('{{$guid}}'));
    - type: after-response
      code: test('Status is 404 Not Found', function () { expect(res.getStatus()).to.equal(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
