info:
  name: Deactivate fee configuration - not found
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/admin/fees/{{missingFeeId}}/deactivate"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('missingFeeId', bru.interpolate('{{$guid}}'));
    - type: after-response
      code: test('Status is 404 Not Found', function () { expect(res.getStatus()).to.equal(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
