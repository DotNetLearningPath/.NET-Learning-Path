info:
  name: Get buildings by client - client not found
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/brokers/clients/{{missingId}}/buildings"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('missingId', bru.interpolate('{{$guid}}'));
    - type: after-response
      code: test('Status is 404 Not Found', function () { expect(res.getStatus()).to.equal(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
