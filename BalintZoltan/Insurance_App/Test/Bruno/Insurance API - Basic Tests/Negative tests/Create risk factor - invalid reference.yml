info:
  name: Create risk factor - invalid reference
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/admin/risk-factors"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "level": 2,
        "reference": "not-a-geography-guid",
        "adjustmentPercentage": 5,
        "isActive": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('Status is 400 Bad Request', function () { expect(res.getStatus()).to.equal(400); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
