info:
  name: Get cities - county not found
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/brokers/counties/{{missingId}}/cities"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('missingId', bru.interpolate('{{$guid}}'));
    - type: after-response
      code: test('Status is 404 Not Found', function () { expect(res.getStatus()).to.equal(404); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
