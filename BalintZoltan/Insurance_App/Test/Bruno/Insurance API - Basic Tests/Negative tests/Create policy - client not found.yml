info:
  name: Create policy - client not found
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/api/brokers/policies"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "clientId": "{{missingClientId}}",
        "buildingId": "{{buildingId}}",
        "brokerId": "{{brokerId}}",
        "currencyId": "{{currencyId}}",
        "startDate": "2027-01-01T00:00:00Z",
        "endDate": "2028-01-01T00:00:00Z",
        "basePremium": 1000
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('missingClientId', bru.interpolate('{{$guid}}'));
    - type: after-response
      code: "test('Status is 400 Bad Request', function () { expect(res.getStatus()).to.equal(400); });\r

        test('Response contains validation details', function () { expect(res.getBody().detail).to.be.a('string').and.not.empty; });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
