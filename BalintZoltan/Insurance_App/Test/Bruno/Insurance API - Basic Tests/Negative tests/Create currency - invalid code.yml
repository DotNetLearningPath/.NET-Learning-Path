info:
  name: Create currency - invalid code
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/api/admin/currencies"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "code": "EURO",
        "name": "Invalid Currency",
        "exchangeRateToBase": 1,
        "isActive": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Status is 400 Bad Request', function () { expect(res.getStatus()).to.equal(400); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
