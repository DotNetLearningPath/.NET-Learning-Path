info:
  name: Search policies
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/brokers/policies?clientId={{clientId}}&pageNumber=1&pageSize=10"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });\r

        test('Response contains paged items', function () { expect(res.getBody().items).to.be.an('array'); });"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
