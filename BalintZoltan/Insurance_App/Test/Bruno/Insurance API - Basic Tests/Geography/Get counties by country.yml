info:
  name: Get counties by country
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/brokers/countries/{{countryId}}/counties"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });\r

        test('Response is an array', function () { expect(res.getBody()).to.be.an('array'); });\r

        const counties = res.getBody();\r

        test('Counties are not empty', function () { expect(counties).to.have.length.greaterThan(0); });\r

        if (counties.length > 0) bru.setCollectionVar('countyId', counties[0].id);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
