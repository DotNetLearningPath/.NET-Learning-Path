info:
  name: Get cities by county
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/brokers/counties/{{countyId}}/cities"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "test('Status is 200 OK', function () { expect(res.getStatus()).to.equal(200); });\r

        test('Response is an array', function () { expect(res.getBody()).to.be.an('array'); });\r

        const cities = res.getBody();\r

        if (!bru.getCollectionVar('cityId') && cities.length > 0) bru.setCollectionVar('cityId', cities[0].id);"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
